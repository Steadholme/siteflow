name: Release Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: GHCR image name. The default matches the installer default.
        required: true
        default: ghcr.io/siteflow/siteflow
        type: string
      image_tag:
        description: Image tag to publish. Defaults to package version.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish release image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Release dependency policy
        run: npm run --silent release:dependency:policy -- --json

      - name: Install dependencies
        run: npm ci

      - name: Release source tree check
        run: npm run --silent release:source:check -- --json

      - name: Release commit readiness plan
        run: npm run --silent release:commit:plan -- --fail-on-blocked --json

      - name: Release evidence pack contract
        run: npm run --silent release:evidence:pack-contract -- --json

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Release artifact gate
        run: |
          npm run --silent release:artifacts:check -- \
            --json \
            --manifest release-artifact-manifest.image.json \
            --commit-ref "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --target-environment image

      - name: Resolve image metadata
        id: image
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image_name="${INPUT_IMAGE_NAME:-ghcr.io/siteflow/siteflow}"
          image_tag="$INPUT_IMAGE_TAG"
          if [ -z "$image_tag" ]; then
            image_tag="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          fi
          image_tag="${image_tag#v}"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$image_name:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_tag=$image_name:$image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.sha_tag }}

      - name: Inspect image attestations
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_REF: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const { writeFileSync } = require("node:fs");

          const imageName = process.env.IMAGE_NAME;
          const imageDigest = process.env.IMAGE_DIGEST;
          const releaseRepository = process.env.REPOSITORY;
          const releaseCommitRef = process.env.COMMIT_REF;
          const releaseRefName = process.env.REF_NAME;
          const imageRef = `${imageName}@${imageDigest}`;
          const sha256DigestPattern = /^sha256:[a-f0-9]{64}$/i;
          const sha256HexPattern = /^[a-f0-9]{64}$/i;

          function inspectRaw(ref) {
            return JSON.parse(execFileSync("docker", ["buildx", "imagetools", "inspect", "--raw", ref], {
              encoding: "utf8",
              maxBuffer: 16 * 1024 * 1024
            }));
          }

          function descriptorsFromIndex(root) {
            return Array.isArray(root?.manifests) ? root.manifests : [];
          }

          function parseImageReference(name) {
            const withoutScheme = name.replace(/^https?:\/\//, "");
            const parts = withoutScheme.split("/");
            if (parts.length < 2) {
              throw new Error(`Image name ${name} does not include a registry/repository path.`);
            }
            return {
              registry: parts[0],
              repository: parts.slice(1).join("/")
            };
          }

          function parseBearerChallenge(challenge) {
            const values = {};
            for (const part of challenge.replace(/^Bearer\s+/i, "").split(/,\s*/)) {
              const match = part.match(/^([^=]+)="?([^"]+)"?$/);
              if (match) {
                values[match[1]] = match[2];
              }
            }
            return values;
          }

          const authTokens = new Map();

          async function registryFetch(url, headers = {}) {
            const cacheKey = `${url.origin}${url.pathname}`;
            const cachedToken = authTokens.get(cacheKey);
            const firstHeaders = cachedToken
              ? { ...headers, Authorization: `Bearer ${cachedToken}` }
              : headers;
            let response = await fetch(url, { headers: firstHeaders });

            if (response.status !== 401) {
              return response;
            }

            const challenge = response.headers.get("www-authenticate") ?? "";
            const auth = parseBearerChallenge(challenge);
            if (!auth.realm) {
              return response;
            }

            const tokenUrl = new URL(auth.realm);
            if (auth.service) {
              tokenUrl.searchParams.set("service", auth.service);
            }
            if (auth.scope) {
              tokenUrl.searchParams.set("scope", auth.scope);
            }

            const tokenHeaders = {};
            if (process.env.GITHUB_ACTOR && process.env.GITHUB_TOKEN) {
              tokenHeaders.Authorization = `Basic ${Buffer.from(`${process.env.GITHUB_ACTOR}:${process.env.GITHUB_TOKEN}`).toString("base64")}`;
            }

            const tokenResponse = await fetch(tokenUrl, { headers: tokenHeaders });
            if (!tokenResponse.ok) {
              return response;
            }

            const tokenBody = await tokenResponse.json();
            const token = tokenBody.token ?? tokenBody.access_token;
            if (!token) {
              return response;
            }

            authTokens.set(cacheKey, token);
            response = await fetch(url, {
              headers: {
                ...headers,
                Authorization: `Bearer ${token}`
              }
            });

            return response;
          }

          async function fetchRegistryBlob(parsedImage, digest) {
            const url = new URL(`https://${parsedImage.registry}/v2/${parsedImage.repository}/blobs/${digest}`);
            const response = await registryFetch(url, {
              Accept: [
                "application/vnd.in-toto+json",
                "application/vnd.dsse.envelope.v1+json",
                "application/octet-stream"
              ].join(", ")
            });

            if (!response.ok) {
              throw new Error(`registry blob fetch failed for ${digest}: ${response.status} ${response.statusText}`);
            }

            return Buffer.from(await response.arrayBuffer());
          }

          function digestForBuffer(buffer) {
            return `sha256:${createHash("sha256").update(buffer).digest("hex")}`;
          }

          function normalizeSha256(value) {
            if (typeof value !== "string" || !value.trim()) {
              return undefined;
            }

            const normalized = value.trim();
            if (sha256DigestPattern.test(normalized)) {
              return normalized;
            }
            if (sha256HexPattern.test(normalized)) {
              return `sha256:${normalized}`;
            }
            return undefined;
          }

          function decodeStatement(raw) {
            const parsed = JSON.parse(raw.toString("utf8"));
            if (parsed && typeof parsed.payload === "string") {
              return JSON.parse(Buffer.from(parsed.payload, "base64").toString("utf8"));
            }
            return parsed;
          }

          function normalizeRepositoryFromUri(uri) {
            if (typeof uri !== "string") {
              return undefined;
            }

            const cleaned = uri.replace(/^git\+/, "");
            const match = cleaned.match(/github\.com[:/]([^/#?@]+)\/([^/#?@]+?)(?:\.git)?(?:[?#@]|$)/i);
            if (!match) {
              return undefined;
            }

            return `${match[1]}/${match[2]}`;
          }

          function refNameFromUri(uri) {
            if (typeof uri !== "string") {
              return undefined;
            }

            const refMatch = uri.match(/refs\/(?:heads|tags)\/([^?#]+)/);
            if (refMatch) {
              return refMatch[1];
            }

            return undefined;
          }

          function digestCommit(digest) {
            if (!digest || typeof digest !== "object") {
              return undefined;
            }

            return digest.gitCommit ?? digest.git_commit ?? digest.sha1;
          }

          function normalizeSubject(subject) {
            if (!subject || typeof subject !== "object") {
              return undefined;
            }

            const digest = subject.digest && typeof subject.digest === "object" ? subject.digest : {};
            const sha256 = normalizeSha256(digest.sha256);
            if (!sha256) {
              return undefined;
            }

            return {
              name: typeof subject.name === "string" ? subject.name : undefined,
              digest: {
                sha256: sha256.replace(/^sha256:/, "")
              }
            };
          }

          function subjectDigests(statement) {
            return (Array.isArray(statement?.subject) ? statement.subject : [])
              .map(normalizeSubject)
              .filter(Boolean);
          }

          function materialCandidates(statement) {
            const predicate = statement?.predicate && typeof statement.predicate === "object"
              ? statement.predicate
              : {};
            const buildDefinition = predicate.buildDefinition && typeof predicate.buildDefinition === "object"
              ? predicate.buildDefinition
              : {};
            const externalParameters = buildDefinition.externalParameters && typeof buildDefinition.externalParameters === "object"
              ? buildDefinition.externalParameters
              : {};
            const candidates = [];

            if (externalParameters.source) {
              candidates.push(typeof externalParameters.source === "string"
                ? { uri: externalParameters.source }
                : externalParameters.source);
            }
            if (predicate.invocation?.configSource) {
              candidates.push(predicate.invocation.configSource);
            }
            if (Array.isArray(buildDefinition.resolvedDependencies)) {
              candidates.push(...buildDefinition.resolvedDependencies);
            }
            if (Array.isArray(predicate.materials)) {
              candidates.push(...predicate.materials);
            }

            return candidates.filter((candidate) => candidate && typeof candidate === "object");
          }

          function normalizeMaterials(statement) {
            return materialCandidates(statement).map((material) => {
              const uri = typeof material.uri === "string" ? material.uri : undefined;
              const digest = material.digest && typeof material.digest === "object" ? material.digest : {};
              return {
                ...(uri ? { uri } : {}),
                ...(normalizeRepositoryFromUri(uri) ? { repository: normalizeRepositoryFromUri(uri) } : {}),
                ...(refNameFromUri(uri) ? { refName: refNameFromUri(uri) } : {}),
                ...(Object.keys(digest).length ? { digest } : {})
              };
            }).filter((material) => material.uri || material.repository || material.digest);
          }

          function sourceFromStatement(statement) {
            const materials = normalizeMaterials(statement);
            const matchingMaterial = materials.find((material) =>
              material.repository?.toLowerCase() === releaseRepository.toLowerCase()
            ) ?? materials.find((material) => material.repository);
            const commitRef = digestCommit(matchingMaterial?.digest);

            return {
              ...(matchingMaterial?.repository ? { repository: matchingMaterial.repository } : {}),
              ...(commitRef ? { commitRef } : {}),
              ...(matchingMaterial?.refName ? { refName: matchingMaterial.refName } : {})
            };
          }

          function builderFromStatement(statement) {
            const predicate = statement?.predicate && typeof statement.predicate === "object"
              ? statement.predicate
              : {};
            const id = predicate.runDetails?.builder?.id ?? predicate.builder?.id;

            return typeof id === "string" && id ? { id } : undefined;
          }

          function addFailedCheck(container, name, message) {
            container.failedChecks = Array.isArray(container.failedChecks) ? container.failedChecks : [];
            container.failedChecks.push({ name, message });
          }

          async function inspectAttestationLayer(parsedImage, descriptor, layer) {
            const predicateType = layer?.annotations?.["in-toto.io/predicate-type"];
            const attestation = {
              requested: true,
              present: true,
              predicateType,
              manifestDigest: descriptor.digest
            };

            const descriptorSubjectDigest = normalizeSha256(descriptor?.annotations?.["vnd.docker.reference.digest"]);
            if (descriptorSubjectDigest) {
              attestation.subjectDigest = descriptorSubjectDigest;
            }

            try {
              const raw = await fetchRegistryBlob(parsedImage, layer.digest);
              const statement = decodeStatement(raw);
              const statementPredicateType = typeof statement?.predicateType === "string"
                ? statement.predicateType
                : undefined;
              const subjects = subjectDigests(statement);
              const statementSubjectDigest = normalizeSha256(subjects[0]?.digest?.sha256);

              attestation.statementDigest = digestForBuffer(raw);
              if (statementPredicateType) {
                attestation.predicateType = statementPredicateType;
              }
              if (subjects.length) {
                attestation.subjects = subjects;
              }
              if (statementSubjectDigest) {
                attestation.subjectDigest = statementSubjectDigest;
              }

              if (!attestation.subjectDigest || attestation.subjectDigest !== imageDigest) {
                addFailedCheck(
                  attestation,
                  "attestation_subject_digest_mismatch",
                  "The inspected attestation statement subject digest does not match the published image digest."
                );
              }

              if (predicateType?.startsWith("https://slsa.dev/provenance/") || statementPredicateType?.startsWith("https://slsa.dev/provenance/")) {
                const source = sourceFromStatement(statement);
                const builder = builderFromStatement(statement);
                const materials = normalizeMaterials(statement);

                attestation.source = source;
                if (builder) {
                  attestation.builder = builder;
                }
                if (materials.length) {
                  attestation.materials = materials;
                }

                if (source.repository?.toLowerCase() !== releaseRepository.toLowerCase()) {
                  addFailedCheck(attestation, "provenance_repository_unverified", "The provenance statement does not bind the expected repository.");
                }
                if (source.commitRef !== releaseCommitRef) {
                  addFailedCheck(attestation, "provenance_commit_unverified", "The provenance statement does not bind the expected commit.");
                }
                if (source.refName !== releaseRefName) {
                  addFailedCheck(attestation, "provenance_ref_unverified", "The provenance statement does not bind the expected ref.");
                }
                if (!builder?.id) {
                  addFailedCheck(attestation, "provenance_builder_unverified", "The provenance statement does not expose a builder identity.");
                }
                if (!materials.length) {
                  addFailedCheck(attestation, "provenance_materials_unverified", "The provenance statement does not expose materials.");
                }
              }
            } catch (error) {
              addFailedCheck(
                attestation,
                "attestation_statement_unavailable",
                error instanceof Error ? error.message : "The attestation statement could not be inspected."
              );
            }

            return attestation;
          }

          async function main() {
            const parsedImage = parseImageReference(imageName);
            const index = inspectRaw(imageRef);
            const attestationDescriptors = descriptorsFromIndex(index).filter((descriptor) => {
              const annotations = descriptor?.annotations ?? {};
              return annotations["vnd.docker.reference.type"] === "attestation-manifest" &&
                typeof descriptor.digest === "string" &&
                descriptor.digest.startsWith("sha256:");
            });

            const inspected = [];
            const evidence = {
              mode: "registry",
              subjectDigest: imageDigest,
              inspector: "docker buildx imagetools inspect --raw + registry blob fetch",
              inspectedAt: new Date().toISOString()
            };

            for (const descriptor of attestationDescriptors) {
              const manifest = inspectRaw(`${imageName}@${descriptor.digest}`);
              const layers = Array.isArray(manifest.layers) ? manifest.layers : [];

              for (const layer of layers) {
                const predicateType = layer?.annotations?.["in-toto.io/predicate-type"];
                if (typeof predicateType !== "string" || !predicateType) {
                  continue;
                }
                inspected.push(await inspectAttestationLayer(parsedImage, descriptor, layer));
              }
            }

            evidence.provenance = inspected.find((entry) =>
              typeof entry.predicateType === "string" &&
                entry.predicateType.startsWith("https://slsa.dev/provenance/")
            ) ?? {
              requested: true,
              present: false,
              failedChecks: [{ name: "provenance_attestation_missing", message: "No SLSA provenance attestation was found in the registry index." }]
            };

            evidence.sbom = inspected.find((entry) =>
              typeof entry.predicateType === "string" &&
                (entry.predicateType.startsWith("https://spdx.dev/") || entry.predicateType.startsWith("https://cyclonedx.org/"))
            ) ?? {
              requested: true,
              present: false,
              failedChecks: [{ name: "sbom_attestation_missing", message: "No SPDX or CycloneDX SBOM attestation was found in the registry index." }]
            };

            if (!attestationDescriptors.length) {
              evidence.failedChecks = [{ name: "attestation_manifest_missing", message: "The registry index does not include attestation manifests." }];
            }

            writeFileSync("release-image-attestations.json", `${JSON.stringify(evidence, null, 2)}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Write image evidence
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_REF: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const attestations = JSON.parse(readFileSync("release-image-attestations.json", "utf8"));
          const evidence = {
            schemaVersion: "siteflow.releaseImageEvidence.v1",
            name: "siteflow-release-image-evidence",
            image: {
              name: process.env.IMAGE_NAME,
              versionTag: process.env.VERSION_TAG,
              commitTag: process.env.SHA_TAG,
              digest: process.env.IMAGE_DIGEST
            },
            source: {
              repository: process.env.REPOSITORY,
              commitRef: process.env.COMMIT_REF,
              refName: process.env.REF_NAME
            },
            github: {
              runId: process.env.RUN_ID,
              runAttempt: process.env.RUN_ATTEMPT
            },
            attestations,
            checkedAt: new Date().toISOString()
          };
          writeFileSync("release-image-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-image-evidence
          path: release-image-evidence.json
          if-no-files-found: error

      - name: Gate image attestation evidence
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const evidence = JSON.parse(readFileSync("release-image-evidence.json", "utf8"));
          const attestations = evidence.attestations ?? {};
          const failed = [
            ...(Array.isArray(attestations.failedChecks) ? attestations.failedChecks : []),
            ...(Array.isArray(attestations.provenance?.failedChecks) ? attestations.provenance.failedChecks : []),
            ...(Array.isArray(attestations.sbom?.failedChecks) ? attestations.sbom.failedChecks : [])
          ];

          if (failed.length || attestations.provenance?.present !== true || attestations.sbom?.present !== true) {
            console.error(JSON.stringify({ failedChecks: failed }, null, 2));
            throw new Error("Published image provenance/SBOM attestation evidence is incomplete.");
          }
          NODE

      - name: Write digest summary
        run: |
          {
            echo "### SiteFlow release image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Version tag: \`${{ steps.image.outputs.version_tag }}\`"
            echo "- Commit tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
