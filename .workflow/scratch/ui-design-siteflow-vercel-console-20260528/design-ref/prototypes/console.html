<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SiteFlow Precision Console Prototype</title>
    <style>
      body { margin: 0; background: oklch(98.5% 0.003 250); color: oklch(19% 0.015 250); font: 14px/1.5 Inter, system-ui, sans-serif; }
      .shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
      aside { border-right: 1px solid oklch(88% 0.006 250); background: white; padding: 16px 12px; }
      main { padding: 24px; }
      .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .panel { border: 1px solid oklch(88% 0.006 250); border-radius: 8px; background: white; padding: 16px; }
      .label { color: oklch(55% 0.012 250); font-size: 12px; font-weight: 700; }
      .value { font-size: 22px; font-weight: 700; }
      table { width: 100%; border-collapse: collapse; margin-top: 16px; background: white; border: 1px solid oklch(88% 0.006 250); }
      th, td { padding: 10px 12px; border-bottom: 1px solid oklch(90% 0.006 250); text-align: left; }
      th { background: oklch(96% 0.004 250); color: oklch(55% 0.012 250); font-size: 12px; }
      .pill { display: inline-flex; border-radius: 999px; padding: 2px 8px; background: oklch(94% 0.035 150); color: oklch(42% 0.13 150); font-size: 12px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside><strong>SiteFlow</strong><p class="label">Projects<br />Deployments<br />Routes<br />Artifacts<br />Audit</p></aside>
      <main>
        <div class="top"><div><div class="label">CONTROL PLANE</div><h1>Projects</h1></div><button>New project</button></div>
        <section class="grid">
          <div class="panel"><div class="label">Healthy routes</div><div class="value">18</div></div>
          <div class="panel"><div class="label">Pending builds</div><div class="value">3</div></div>
          <div class="panel"><div class="label">Edge config</div><div class="value">42</div></div>
          <div class="panel"><div class="label">Drift</div><div class="value">1</div></div>
        </section>
        <table><thead><tr><th>Project</th><th>Production</th><th>Route</th><th>Status</th></tr></thead><tbody><tr><td>Core API</td><td>dep_healthy</td><td>abc123.w33d.xyz</td><td><span class="pill">Healthy</span></td></tr></tbody></table>
      </main>
    </div>
  </body>
</html>
